<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
{% comment %} sidebar: indented list of faculty links under "Faculty & Labs" (from _data/faculty.yml).
   NB: theme minifies HTML to one line, so no // comments inside the script. {% endcomment %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var fac = "{{ '/faculty.html' | relative_url }}";
  var a = document.querySelector('#site-nav a.nav-list-link[href="' + fac + '"]');
  /* on the faculty page itself the theme strips href from the active link */
  if (!a && location.pathname === fac) a = document.querySelector('#site-nav a.nav-list-link.active');
  if (!a) return;
  var people = {{ site.data.faculty | jsonify }};
  var ul = document.createElement("ul");
  ul.className = "nav-people";
  people.forEach(function (p) {
    var li = document.createElement("li"), l = document.createElement("a");
    l.textContent = p.name;
    l.href = p.url || fac;
    li.appendChild(l);
    ul.appendChild(li);
  });
  a.parentNode.appendChild(ul);
});
</script>
